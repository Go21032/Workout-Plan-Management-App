<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筋トレ記録 自動入力</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    .upload-area {
      border: 2px dashed #d0d0d0;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
      position: relative;
    }

    .upload-area:hover, .upload-area.drag-over {
      border-color: #4f8ef7;
      background: #f0f5ff;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 40px; margin-bottom: 12px; }

    .upload-text {
      font-size: 15px;
      color: #555;
      font-weight: 500;
    }

    .upload-sub {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    #preview-area {
      display: none;
      margin-bottom: 20px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .preview-item {
      position: relative;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      background: #fafafa;
    }

    .preview-item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .preview-item .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      font-size: 13px;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }

    .preview-count {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .add-more-btn {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #4f8ef7;
      background: none;
      border: 1px dashed #b9d3fb;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .change-btn {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 4px;
      text-decoration: underline;
    }

    #run-btn {
      width: 100%;
      padding: 14px;
      background: #4f8ef7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #run-btn:hover:not(:disabled) { background: #3a7ae0; }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 14px; color: #555; }

    #result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    #result.success {
      background: #f0faf4;
      border: 1px solid #b2dfcc;
      color: #1e7a46;
    }

    #result.error {
      background: #fff5f5;
      border: 1px solid #fcc;
      color: #c0392b;
    }

    .result-icon { font-size: 20px; margin-right: 6px; }

    #reset-btn {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: none;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }

    #reset-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💪 筋トレ記録 自動入力ver29</h1>
    <p class="subtitle">手書きメモの写真をアップロードするだけで自動でシートに記録します（1日のメモが複数枚に分かれている場合は2枚まで同時に選択できます。自動で1枚に結合してから解析します）</p>

    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept="image/*" multiple>
      <div class="upload-icon">📷</div>
      <div class="upload-text">写真をここにドロップ</div>
      <div class="upload-sub">またはクリックして選択（JPG / PNG・最大2枚）</div>
    </div>

    <div id="preview-area">
      <p class="preview-count" id="preview-count"></p>
      <div class="preview-grid" id="preview-grid"></div>
      <button class="add-more-btn" id="add-more-btn" onclick="triggerAddMore()">＋ もう1枚追加する（同じ日の続き）</button>
      <button class="change-btn" onclick="resetUpload()">最初からやり直す</button>
    </div>

    <button id="run-btn" onclick="runProcess()" disabled>
      画像を解析してシートに記録する
    </button>

    <div id="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">AIが画像を解析中...</p>
    </div>

    <div id="result"></div>

    <button id="reset-btn" onclick="resetAll()">新しい写真を登録する</button>
  </div>

  <input type="file" id="file-input-add" accept="image/*" style="display:none;">
  <canvas id="merge-canvas" style="display:none;"></canvas>

  <script>
    const MAX_IMAGES = 2;
    let selectedFiles = [];

    const fileInput     = document.getElementById('file-input');
    const fileInputAdd  = document.getElementById('file-input-add');
    const uploadArea    = document.getElementById('upload-area');
    const previewArea   = document.getElementById('preview-area');
    const previewGrid   = document.getElementById('preview-grid');
    const previewCount  = document.getElementById('preview-count');
    const addMoreBtn    = document.getElementById('add-more-btn');
    const runBtn        = document.getElementById('run-btn');
    const loading       = document.getElementById('loading');
    const loadingText   = document.getElementById('loading-text');
    const result        = document.getElementById('result');
    const resetBtn      = document.getElementById('reset-btn');
    const mergeCanvas   = document.getElementById('merge-canvas');

    fileInput.addEventListener('change', (e) => {
      addFiles(Array.from(e.target.files));
      fileInput.value = '';
    });

    fileInputAdd.addEventListener('change', (e) => {
      addFiles(Array.from(e.target.files));
      fileInputAdd.value = '';
    });

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('drag-over');
    });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
    });

    function triggerAddMore() {
      if (selectedFiles.length >= MAX_IMAGES) return;
      fileInputAdd.click();
    }

    function addFiles(files) {
      const imageFiles = files.filter(f => f.type.startsWith('image/'));
      if (imageFiles.length === 0) return;
      for (const f of imageFiles) {
        if (selectedFiles.length >= MAX_IMAGES) break;
        selectedFiles.push(f);
      }
      renderPreview();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderPreview();
    }

    function renderPreview() {
      if (selectedFiles.length === 0) { resetUpload(); return; }

      uploadArea.style.display  = 'none';
      previewArea.style.display = 'block';
      runBtn.disabled           = false;
      result.style.display      = 'none';
      resetBtn.style.display    = 'none';

      previewCount.textContent = selectedFiles.length === 1
        ? '1枚を解析します'
        : `${selectedFiles.length}枚を1枚に結合・リサイズしてから解析します`;

      previewGrid.innerHTML = '';
      selectedFiles.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const item = document.createElement('div');
          item.className = 'preview-item';
          item.innerHTML = `
            <img src="${e.target.result}" alt="プレビュー${idx + 1}">
            <button class="remove-btn" onclick="removeFile(${idx})">×</button>
          `;
          previewGrid.appendChild(item);
        };
        reader.readAsDataURL(file);
      });

      addMoreBtn.style.display = selectedFiles.length < MAX_IMAGES ? 'block' : 'none';
    }

    function resetUpload() {
      uploadArea.style.display  = 'block';
      previewArea.style.display = 'none';
      runBtn.disabled           = true;
      selectedFiles             = [];
      fileInput.value           = '';
      fileInputAdd.value        = '';
      previewGrid.innerHTML     = '';
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const img    = new Image();
        const reader = new FileReader();
        reader.onload = (e) => {
          img.onload  = () => resolve(img);
          img.onerror = reject;
          img.src     = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 複数画像をCanvasで縦結合＋長辺リサイズし、1枚のJPEG（Base64ヘッダ抜き）を返す
    async function mergeImagesToBase64(files) {
      const MAX_LONG_SIDE = 1500; // 長辺の最大ピクセル数
      const JPEG_QUALITY  = 0.82; // JPEG品質

      const images = await Promise.all(files.map(loadImage));

      // リサイズ後のサイズを計算
      function calcSize(img) {
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        const longSide = Math.max(w, h);
        if (longSide <= MAX_LONG_SIDE) return { w, h };
        const scale = MAX_LONG_SIDE / longSide;
        return { w: Math.round(w * scale), h: Math.round(h * scale) };
      }

      const sizes = images.map(calcSize);

      // 横幅はリサイズ後の最大値に統一
      const targetWidth = Math.max(...sizes.map(s => s.w));

      // 横幅に合わせて各画像の高さを再スケール
      const finalHeights = images.map((img, idx) => {
        const s = sizes[idx];
        return Math.round(s.h * (targetWidth / s.w));
      });

      const totalHeight = finalHeights.reduce((sum, h) => sum + h, 0);

      mergeCanvas.width  = targetWidth;
      mergeCanvas.height = totalHeight;
      const ctx = mergeCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, targetWidth, totalHeight);

      let yOffset = 0;
      images.forEach((img, idx) => {
        const h = finalHeights[idx];
        ctx.drawImage(img, 0, yOffset, targetWidth, h);
        yOffset += h;
      });

      const dataUrl = mergeCanvas.toDataURL('image/jpeg', JPEG_QUALITY);
      return dataUrl.split(',')[1];
    }

    async function runProcess() {
      if (selectedFiles.length === 0) return;

      runBtn.disabled        = true;
      loading.style.display  = 'block';
      result.style.display   = 'none';
      resetBtn.style.display = 'none';
      loadingText.textContent = selectedFiles.length > 1
        ? `${selectedFiles.length}枚の画像を結合・リサイズ中...`
        : '画像を準備中...';

      try {
        const base64Data = await mergeImagesToBase64(selectedFiles);

        loadingText.textContent = 'AIが画像を解析中...';

        google.script.run
          .withSuccessHandler((res) => {
            loading.style.display  = 'none';
            result.style.display   = 'block';
            resetBtn.style.display = 'block';
            if (res.success) {
              result.className = 'success';
              result.innerHTML = `<span class="result-icon">✅</span>${res.message}`;
            } else {
              result.className = 'error';
              result.innerHTML = `<span class="result-icon">❌</span>エラー: ${res.message}`;
              runBtn.disabled = false;
            }
          })
          .withFailureHandler((err) => {
            loading.style.display = 'none';
            result.style.display  = 'block';
            result.className      = 'error';
            result.innerHTML      = `<span class="result-icon">❌</span>通信エラー: ${err.message}`;
            runBtn.disabled       = false;
          })
          .processImage(base64Data);

      } catch (e) {
        loading.style.display = 'none';
        result.style.display  = 'block';
        result.className      = 'error';
        result.innerHTML      = `<span class="result-icon">❌</span>エラー: ${e.message}`;
        runBtn.disabled       = false;
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function resetAll() {
      resetUpload();
      result.style.display    = 'none';
      resetBtn.style.display  = 'none';
      loadingText.textContent = 'AIが画像を解析中...';
    }
  </script>
</body>
</html>
