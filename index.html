<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>筋トレ記録 自動入力</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 28px; }

    .upload-area {
      border: 2px dashed #d0d0d0;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
      position: relative;
    }
    .upload-area:hover, .upload-area.drag-over { border-color: #4f8ef7; background: #f0f5ff; }
    .upload-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { font-size: 40px; margin-bottom: 12px; }
    .upload-text { font-size: 15px; color: #555; font-weight: 500; }
    .upload-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

    #preview-area { display: none; margin-bottom: 20px; text-align: center; }
    #preview-img { max-width: 100%; max-height: 260px; border-radius: 10px; border: 1px solid #e0e0e0; object-fit: contain; }
    .preview-name { font-size: 12px; color: #888; margin-top: 8px; }
    .change-btn { font-size: 12px; color: #4f8ef7; background: none; border: none; cursor: pointer; margin-top: 4px; text-decoration: underline; }

    #run-btn {
      width: 100%; padding: 14px; background: #4f8ef7; color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    #run-btn:hover:not(:disabled) { background: #3a7ae0; }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #loading { display: none; text-align: center; margin-top: 20px; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #e0e0e0;
      border-top-color: #4f8ef7; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #555; }

    #result { display: none; margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 14px; line-height: 1.6; }
    #result.success { background: #f0faf4; border: 1px solid #b2dfcc; color: #1e7a46; }
    #result.error { background: #fff5f5; border: 1px solid #fcc; color: #c0392b; }
    #result.warning { background: #fffbf0; border: 1px solid #f5d87a; color: #7a5c00; }
    .result-icon { font-size: 20px; margin-right: 6px; }

    /* 日付修正エリア */
    #date-fix-area {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }
    #date-fix-area label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }
    #date-input {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px;
    }
    #date-input:focus { outline: none; border-color: #4f8ef7; }
    #date-submit-btn {
      width: 100%; padding: 12px; background: #4f8ef7; color: white;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer;
    }
    #date-submit-btn:hover { background: #3a7ae0; }

    #reset-btn { display: none; width: 100%; margin-top: 12px; padding: 10px; background: none; border: 1px solid #d0d0d0; border-radius: 10px; font-size: 14px; color: #555; cursor: pointer; }
    #reset-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💪 筋トレ記録 自動入力ver23</h1>
    <p class="subtitle">手書きメモの写真をアップロードするだけで自動でシートに記録します</p>

    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept="image/*">
      <div class="upload-icon">📷</div>
      <div class="upload-text">写真をここにドロップ</div>
      <div class="upload-sub">またはクリックして選択（JPG / PNG）</div>
    </div>

    <div id="preview-area">
      <img id="preview-img" src="" alt="プレビュー">
      <p class="preview-name" id="preview-name"></p>
      <button class="change-btn" onclick="resetUpload()">別の写真に変更</button>
    </div>

    <button id="run-btn" onclick="runProcess()" disabled>
      画像を解析してシートに記録する
    </button>

    <div id="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">AIが画像を解析中...</p>
    </div>

    <div id="result"></div>

    <!-- 日付修正エリア（かぶり時のみ表示） -->
    <div id="date-fix-area">
      <label>正しい日付を入力してください（例：26/6/8）</label>
      <input type="text" id="date-input" placeholder="YY/M/D 形式で入力">
      <button id="date-submit-btn" onclick="submitManualDate()">この日付で登録する</button>
    </div>

    <button id="reset-btn" onclick="resetAll()">新しい写真を登録する</button>
  </div>

  <script>
    let selectedFile = null;

    const fileInput     = document.getElementById('file-input');
    const uploadArea    = document.getElementById('upload-area');
    const previewArea   = document.getElementById('preview-area');
    const previewImg    = document.getElementById('preview-img');
    const previewName   = document.getElementById('preview-name');
    const runBtn        = document.getElementById('run-btn');
    const loading       = document.getElementById('loading');
    const loadingText   = document.getElementById('loading-text');
    const result        = document.getElementById('result');
    const resetBtn      = document.getElementById('reset-btn');
    const dateFix       = document.getElementById('date-fix-area');
    const dateInput     = document.getElementById('date-input');

    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('drag-over'); });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        previewName.textContent = file.name;
        uploadArea.style.display = 'none';
        previewArea.style.display = 'block';
        runBtn.disabled = false;
        result.style.display = 'none';
        dateFix.style.display = 'none';
        resetBtn.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function resetUpload() {
      uploadArea.style.display = 'block';
      previewArea.style.display = 'none';
      runBtn.disabled = true;
      selectedFile = null;
      fileInput.value = '';
      dateFix.style.display = 'none';
    }

    async function runProcess() {
      if (!selectedFile) return;

      runBtn.disabled = true;
      loading.style.display = 'block';
      result.style.display = 'none';
      dateFix.style.display = 'none';
      resetBtn.style.display = 'none';
      loadingText.textContent = 'AIが画像を解析中...';

      try {
        const base64 = await toBase64(selectedFile);
        const base64Data = base64.split(',')[1];

        loadingText.textContent = 'スプレッドシートに書き込み中...';

        google.script.run
          .withSuccessHandler(handleResponse)
          .withFailureHandler((err) => {
            loading.style.display = 'none';
            showResult('error', `通信エラー: ${err.message}`);
            runBtn.disabled = false;
          })
          .processImage(base64Data);

      } catch (e) {
        loading.style.display = 'none';
        showResult('error', `エラー: ${e.message}`);
        runBtn.disabled = false;
      }
    }

    function handleResponse(res) {
      loading.style.display = 'none';

      if (res.needsConfirm) {
        // 日付かぶり → 警告表示 ＋ 日付入力欄を出す
        showResult('warning', `⚠️ ${res.message}`);
        dateInput.value = res.date; // AIが読んだ日付を初期値としてセット
        dateFix.style.display = 'block';
        dateInput.focus();
        return;
      }

      resetBtn.style.display = 'block';
      if (res.success) {
        showResult('success', `✅ ${res.message}`);
      } else {
        showResult('error', `❌ エラー: ${res.message}`);
        runBtn.disabled = false;
      }
    }

    function submitManualDate() {
      const manualDate = dateInput.value.trim();
      if (!manualDate) {
        dateInput.style.borderColor = '#e74c3c';
        dateInput.focus();
        return;
      }
      dateInput.style.borderColor = '#ccc';
      dateFix.style.display = 'none';
      loading.style.display = 'block';
      loadingText.textContent = 'スプレッドシートに書き込み中...';

      google.script.run
        .withSuccessHandler(handleResponse)
        .withFailureHandler((err) => {
          loading.style.display = 'none';
          showResult('error', `通信エラー: ${err.message}`);
          dateFix.style.display = 'block';
        })
        .writeWithManualDate(manualDate);
    }

    function showResult(type, message) {
      result.className = type;
      result.innerHTML = message;
      result.style.display = 'block';
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function resetAll() {
      resetUpload();
      result.style.display = 'none';
      dateFix.style.display = 'none';
      resetBtn.style.display = 'none';
      runBtn.disabled = true;
      loadingText.textContent = 'AIが画像を解析中...';
    }
  </script>
</body>
</html>
